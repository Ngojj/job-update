name: Job Alert

on:
  schedule:
    # 9h sáng và 20h tối giờ Việt Nam (GitHub dùng giờ UTC, VN = UTC+7)
    - cron: "0 2,13 * * *"
  workflow_dispatch: {} # cho phép bấm nút chạy tay trên GitHub

permissions:
  contents: write # để commit lại file seen_jobs.json

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit seen-jobs state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --cached --quiet || (git commit -m "chore: update seen jobs [skip ci]" && git push)
